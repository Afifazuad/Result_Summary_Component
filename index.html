<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="result">
      <h1> YourResult</h1>
      <div class="score">
        <p class="score-value">76</p>
        <p class="score-max">of 100</p>
      </div>
      <div class="result_description">
        <p>Great</p>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
      </div>
    </div>
    <div class="summary">
      <h1>Summary</h1>
      <div class="summary_list">
        <div class="summary_item_1">
          <div class="item_label_1">
            <img src="./assets/images/icon-reaction.svg" alt="reaction icon">
            <p>Reaction</p>
          </div>
          <p>80 / 100</p>
        </div>
        <div class="summary_item_2">
          <div class="item_label_2">
            <img src="./assets/images/icon-memory.svg" alt="memory icon">
            <p>Memory</p>
          </div>
          <p>92 / 100</p>
        </div>
        <div class="summary_item_3">
          <div class="item_label_3">
            <img src="./assets/images/icon-verbal.svg" alt="verbal icon">
            <p>Verbal</p>
          </div>
          <p>61 / 100</p>
        </div>
        <div class="summary_item_4">
          <div class="item_label_4">
            <img src="./assets/images/icon-visual.svg" alt="visual icon">
            <p>Visual</p>
          </div>
          <p>72 / 100</p>
        </div>
      </div>
      <button class="continue">Continue</button>
    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
